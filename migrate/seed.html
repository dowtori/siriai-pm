<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SIRIAI PM — 데이터 마이그레이션</title>
<style>
body{font-family:monospace;padding:40px;background:#f5f5f3;color:#1a1a1a;font-size:13px;}
h2{font-size:15px;margin-bottom:20px;}
.log{background:#fff;border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:16px;
  max-height:500px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;}
.ok{color:#2d8a4e;} .err{color:#c0392b;} .info{color:#1a6fa8;}
button{padding:10px 24px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;
  font-size:13px;cursor:pointer;margin-right:10px;}
button:disabled{opacity:.4;}
.warn{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);
  border-radius:6px;padding:12px 16px;margin-bottom:20px;color:#c0392b;font-size:12px;}
</style>
</head>
<body>
<h2>SIRIAI PM · 초기 데이터 마이그레이션</h2>
<div class="warn">⚠ 이 페이지는 <strong>1회만</strong> 실행하세요. 중복 실행 시 데이터가 중복 삽입됩니다.<br>
config.js의 SUPABASE_URL과 SUPABASE_KEY가 올바르게 설정되어 있어야 합니다.</div>
<button id="btnRun">마이그레이션 시작</button>
<button id="btnCheck">현재 DB 건수 확인</button>
<div class="log" id="log">준비 완료. "마이그레이션 시작" 버튼을 누르세요.\n</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
const { createClient } = supabase;
const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const logEl = document.getElementById('log');

function log(msg, cls = '') {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('btnCheck').onclick = async () => {
  const { count: cc } = await sb.from('campaigns').select('*', { count: 'exact', head: true });
  const { count: cli } = await sb.from('clients').select('*', { count: 'exact', head: true });
  log(`현재 DB: 캠페인 ${cc}건, 거래처 ${cli}건`, 'info');
};

document.getElementById('btnRun').onclick = async () => {
  document.getElementById('btnRun').disabled = true;
  log('\n=== 마이그레이션 시작 ===', 'info');

  try {
    // 1. seed_data.json 로드
    log('seed_data.json 로딩 중…');
    const res = await fetch('./seed_data.json');
    const data = await res.json();
    log(`  캠페인 ${data.campaigns.length}건, 거래처 ${data.clients.length}개 로드됨`, 'ok');

    // 2. 거래처 삽입
    log('\n[1/3] 거래처 삽입 중…');
    const { data: insertedClients, error: cliErr } = await sb
      .from('clients')
      .upsert(data.clients, { onConflict: 'name', ignoreDuplicates: true })
      .select();
    if (cliErr) throw new Error('거래처 오류: ' + cliErr.message);
    log(`  거래처 ${insertedClients?.length ?? '?'}건 완료`, 'ok');

    // 거래처 name→id 맵
    const { data: allClients } = await sb.from('clients').select('id, name');
    const clientMap = {};
    allClients.forEach(c => clientMap[c.name] = c.id);

    // 3. 캠페인 삽입 (배치 50건씩)
    log('\n[2/3] 캠페인 삽입 중…');
    const campaigns = data.campaigns.map(c => ({
      ...c,
      client_id: c.client_name ? (clientMap[c.client_name] || null) : null,
    }));

    let done = 0;
    const BATCH = 50;
    for (let i = 0; i < campaigns.length; i += BATCH) {
      const batch = campaigns.slice(i, i + BATCH);
      const { error } = await sb.from('campaigns').insert(batch);
      if (error) throw new Error(`캠페인 배치 ${i}~${i+BATCH} 오류: ${error.message}`);
      done += batch.length;
      log(`  ${done}/${campaigns.length}건…`);
    }
    log(`  캠페인 ${done}건 완료`, 'ok');

    // 4. 검증
    log('\n[3/3] 검증 중…');
    const { count } = await sb.from('campaigns').select('*', { count: 'exact', head: true });
    log(`  DB 최종 캠페인 건수: ${count}건`, 'ok');

    log('\n✅ 마이그레이션 완료! index.html을 여세요.', 'ok');

  } catch (err) {
    log('\n❌ 오류: ' + err.message, 'err');
    document.getElementById('btnRun').disabled = false;
  }
};
</script>
</body>
</html>
